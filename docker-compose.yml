services:
  searxng:
    image: searxng/searxng:latest
    container_name: mining-prospector-search
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=Mining Prospector Search
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  prospector:
    build: .
    container_name: mining-prospector-app
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
    environment:
      - PORT=3000
      - SEARXNG_URL=http://searxng:8080
    ports:
      - "3000:3000"
